# Dependabot: weekly update pull requests for Python packages (uv.lock) and
# the GitHub Actions used by the workflows. Security updates for known
# vulnerabilities are raised separately as soon as an advisory appears.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Match the 7-day waiting period in pyproject.toml ([tool.uv]). yt-dlp
    # has a shorter window there, which uv enforces when the lock is updated.
    cooldown:
      default-days: 7
      exclude:
        - "yt-dlp"
        - "yt-dlp-ejs"
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
