  <rect x="41" y="58" width="46" height="36" rx="5" fill="#f5f7fb"/>
  <g fill="#1b2638">
    <rect x="45" y="61" width="4" height="3.4" rx="1"/><rect x="53.5" y="61" width="4" height="3.4" rx="1"/><rect x="62" y="61" width="4" height="3.4" rx="1"/><rect x="70.5" y="61" width="4" height="3.4" rx="1"/><rect x="79" y="61" width="4" height="3.4" rx="1"/>
    <rect x="45" y="87.6" width="4" height="3.4" rx="1"/><rect x="53.5" y="87.6" width="4" height="3.4" rx="1"/><rect x="62" y="87.6" width="4" height="3.4" rx="1"/><rect x="70.5" y="87.6" width="4" height="3.4" rx="1"/><rect x="79" y="87.6" width="4" height="3.4" rx="1"/>
  </g>
  <rect x="44.5" y="66.5" width="39" height="19" rx="1.5" fill="url(#day)"/>
  <circle cx="74" cy="72.5" r="3.6" fill="#e5484d"/>
  <path d="M44.5 85.5V80Q52 73.5 58 77.5Q64 81 70 76Q77 71 83.5 78V85.5Z" fill="#2b3a55"/>
