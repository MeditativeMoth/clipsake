  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#sky)"/>
  <!-- chain -->
  <path d="M37 8Q46 22 64 22Q82 22 91 8" fill="none" stroke="#e8b85c" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="0.1 5.4"/>
