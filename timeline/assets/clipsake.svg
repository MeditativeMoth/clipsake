<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a55"/>
      <stop offset="1" stop-color="#141c2b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3a3"/>
      <stop offset="0.45" stop-color="#f0bc5e"/>
      <stop offset="1" stop-color="#b9802c"/>
    </linearGradient>
    <linearGradient id="rim" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe3a3"/>
      <stop offset="1" stop-color="#a86f22"/>
    </linearGradient>
    <linearGradient id="day" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f9fd0"/>
      <stop offset="1" stop-color="#c9d8ee"/>
