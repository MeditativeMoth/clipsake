  <circle cx="64" cy="25.5" r="5.5" fill="none" stroke="url(#gold)" stroke-width="3.4"/>
  <rect x="59" y="30" width="10" height="7" rx="2.5" fill="url(#gold)"/>
  <!-- locket -->
  <circle cx="64" cy="76" r="41" fill="url(#gold)"/>
  <circle cx="64" cy="76" r="34" fill="url(#rim)"/>
  <circle cx="64" cy="76" r="31" fill="#1b2638"/>
